name: Release Build & Package

on:
  workflow_dispatch:
  push:
    branches: [ "releases/*" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: dotnet restore src/Simple.OData.Client.slnx

    - name: Build
      run: dotnet build src/Simple.OData.Client.slnx --no-restore --configuration Release /p:Version="${{ vars.RELEASE_VERSION_MAJORMINOR }}"

    - name: Test
      run: dotnet test src/Simple.OData.Client.slnx --no-build --configuration Release

    - name: Pack
      run: dotnet pack src/Simple.OData.Client/Simple.OData.Client.csproj --no-build --configuration Release --output packages /p:Version="${{ vars.RELEASE_VERSION_MAJORMINOR }}"

    - name: Upload packages
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: packages

    - name: Push to NuGet
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      if: ${{ env.NUGET_API_KEY != '' }}
      run: dotnet nuget push "packages/*.nupkg" --skip-duplicate --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY"
