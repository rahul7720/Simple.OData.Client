name: GitHub Release

# Creates a GitHub release for a version tag (v7.0.0, v7.1.0, ...) with the built packages attached.
# The tag must match <Version> in src/Simple.OData.Client/Simple.OData.Client.csproj.
# Publishing to nuget.org stays in release.yml.

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for example v7.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Resolve the tag
      id: tag
      env:
        TAG: ${{ inputs.tag || github.ref_name }}
      run: |
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

    - uses: actions/checkout@v4
      with:
        ref: ${{ steps.tag.outputs.tag }}

    - name: Check the tag against the package version
      env:
        VERSION: ${{ steps.tag.outputs.version }}
      run: |
        PACKAGE_VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/Simple.OData.Client/Simple.OData.Client.csproj)
        if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
          echo "::error::Tag version $VERSION does not match <Version>$PACKAGE_VERSION</Version> in Simple.OData.Client.csproj"
          exit 1
        fi

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: dotnet restore src/Simple.OData.Client.slnx

    - name: Build
      run: dotnet build src/Simple.OData.Client.slnx --no-restore --configuration Release

    - name: Test
      run: dotnet test src/Simple.OData.Client.slnx --no-build --configuration Release

    - name: Pack
      run: dotnet pack src/Simple.OData.Client/Simple.OData.Client.csproj --no-build --configuration Release --output packages

    - name: Collect release notes
      env:
        TAG: ${{ steps.tag.outputs.tag }}
      run: |
        if [ -f "docs/releases/$TAG.md" ]; then
          cp "docs/releases/$TAG.md" release-notes.md
        else
          awk '/^#### /{ section++ } section == 1' RELEASE_NOTES.md > release-notes.md
        fi
        cat release-notes.md

    - name: Create the GitHub release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ steps.tag.outputs.tag }}
        VERSION: ${{ steps.tag.outputs.version }}
      run: |
        gh release create "$TAG" packages/*.nupkg packages/*.snupkg \
          --repo "$GITHUB_REPOSITORY" \
          --title "Simple.OData.Client $VERSION" \
          --notes-file release-notes.md \
          --verify-tag
